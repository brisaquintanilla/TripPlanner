{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-6 py-12">
    <div class="text-center mb-12">
        <h2 class="text-3xl md:text-5xl font-bold text-white mb-4">¿Qué te interesa hacer en <span class="text-sky-400">{{ destination }}</span>?</h2>
        <p class="text-slate-300 text-lg">Selecciona tus preferencias para personalizar tu experiencia.</p>
    </div>

    <form action="/interests" method="POST" class="max-w-5xl mx-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for it in interests_def %}
            <label class="cursor-pointer group relative">
                <input type="checkbox" name="interests" value="{{ it.key }}" class="peer sr-only">
                <div class="bg-slate-800 rounded-xl overflow-hidden border-2 border-slate-700 peer-checked:border-sky-500 peer-checked:bg-slate-800/80 transition-all duration-300 h-full hover:shadow-lg hover:shadow-sky-500/20">
                    <div class="h-40 bg-cover bg-center" style="background-image: url('{{ it.image }}');">
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                    </div>
                    <div class="p-6 text-center relative">
                        <div class="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-slate-900 p-3 rounded-full border border-slate-700 group-hover:scale-110 transition-transform peer-checked:border-sky-500 peer-checked:text-sky-400">
                            <i class="fa-solid {{ it.icon }} text-2xl"></i>
                        </div>
                        <h3 class="mt-4 text-xl font-bold text-white">{{ it.title }}</h3>
                        <p class="text-slate-400 text-sm mt-2">{{ it.desc }}</p>
                    </div>
                    <div class="absolute top-4 right-4 opacity-0 peer-checked:opacity-100 transition-opacity">
                        <div class="bg-sky-500 text-white rounded-full p-1">
                            <i class="fa-solid fa-check"></i>
                        </div>
                    </div>
                </div>
            </label>
            {% endfor %}
        </div>

        <p id="interest-helper" class="mt-8 text-center text-slate-300">Elige hasta 3 intereses. También agregaremos wildcards para sorprenderte.</p>

        <div class="mt-12 text-center">
            <button type="submit" class="inline-flex items-center gap-3 bg-sky-600 hover:bg-sky-700 text-white text-xl font-bold py-4 px-12 rounded-full shadow-lg shadow-sky-500/30 transition-all hover:scale-105">
                Continuar
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </form>
</div>
<script>
    // Limitar selección a 3 intereses
    const interestCheckboxes = document.querySelectorAll('input[name="interests"]');
    const helper = document.getElementById('interest-helper');
    const maxInterests = 3;

    interestCheckboxes.forEach((checkbox) => {
        checkbox.addEventListener('change', () => {
            const selected = Array.from(interestCheckboxes).filter((c) => c.checked);
            if (selected.length > maxInterests) {
                checkbox.checked = false;
                helper.textContent = 'Solo puedes elegir 3 intereses. Ya añadiremos wildcards por ti.';
                helper.classList.add('text-rose-300');
                setTimeout(() => {
                    helper.textContent = 'Elige hasta 3 intereses. También agregaremos wildcards para sorprenderte.';
                    helper.classList.remove('text-rose-300');
                }, 2000);
            }
        });
    });
</script>
{% endblock %}
